[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
# Strict only for security paths; rest is best-effort (see per-module overrides)
strict = False

# Untyped followers: silence the dependency-graph cascade. Each P-phase flips
# a module from here to its own strict section (most-specific match wins).
# NOTE: netmedic_ai/gi sections were removed — with netmedic.* ignored, mypy
# no longer follows into those graphs for the checked files. Re-add if the
# checked set grows to include files importing them directly.
[mypy-netmedic.*]
ignore_errors = True

[mypy-netmedic.ipc_security]
strict = True

[mypy-netmedic.helper_verbs]
strict = True

[mypy-netmedic.action_catalog]
strict = True

[mypy-netmedic.models]
strict = True

# NOTE: no-untyped-call is disabled for these four: they call into
# still-untyped layers (NetworkMedic, Gtk, operators). All defs in these
# modules are typed; the cascade into untyped deps is P2 follow-up work.
[mypy-netmedic.ipc_bridge]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.ipc_actions]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.runtime]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.lifecycle]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.polkit_auth]
warn_return_any = True
ignore_missing_imports = True
