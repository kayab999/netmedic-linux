[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
# Strict only for security paths; rest is best-effort (see per-module overrides)
strict = False
# M9: the package root is netmedic/ (outer dir has no __init__.py), so
# without these, file args like netmedic/netmedic/helper_main.py mapped to
# top-level module `helper_main` and NO per-module section ever matched —
# every "strict" CI run was silently checking nothing. Verified with a
# deliberate int-vs-str probe (see M9 notes).
mypy_path = netmedic
explicit_package_bases = True

# M9: NO glob allowlist sections (e.g. [mypy-netmedic.*]). Proven by probe:
# in mypy 2.x a glob with ignore_errors shadows every specific strict
# section, so all "strict" CI runs silently checked nothing. Unstrict
# followers get explicit per-file sections below (M9 ratchet queue —
# flip a file to its own strict section when annotated). A guardian test
# (test_m9_typing.py) bans glob sections so the crutch can't return.

[mypy-netmedic.ipc_security]
strict = True

[mypy-netmedic.helper_verbs]
strict = True

[mypy-netmedic.action_catalog]
strict = True

# M9: small, fully annotated, ships to the helper — strict from birth.
[mypy-netmedic.validators]
strict = True

[mypy-netmedic.models]
strict = True

# NOTE: no-untyped-call is disabled for these four: they call into
# still-untyped layers (NetworkMedic, Gtk, operators). All defs in these
# modules are typed; the cascade into untyped deps is P2 follow-up work.
[mypy-netmedic.ipc_bridge]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.ipc_actions]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.runtime]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.lifecycle]
strict = True
disable_error_code = no-untyped-call

# M9: measured true-strict-clean (only the gi stub import needs its exemption).
[mypy-netmedic.config]
strict = True

# M9: root path. Popen generics + int/float timeout annotated at the
# boundary; untyped NetworkMedic/Gtk/operator calls keep the established
# no-untyped-call exemption (same as ipc_bridge/ipc_actions/runtime).
[mypy-netmedic.helper_main]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.system]
strict = True
disable_error_code = no-untyped-call

[mypy-netmedic.polkit_auth]
strict = True
warn_return_any = True
ignore_missing_imports = True
# mypy 2.x reports installed-but-stubless gi under import-untyped, which
# ignore_missing_imports no longer covers.
disable_error_code = import-untyped

# M9 ratchet queue: explicit per-file silences for unstrict followers.
# Each flips to its own strict section when annotated. No globs (see above).
[mypy-netmedic.ui]
ignore_errors = True
[mypy-netmedic.ui_vpn]
ignore_errors = True
[mypy-netmedic.ai_console]
ignore_errors = True
[mypy-netmedic.ipc_client]
ignore_errors = True
[mypy-netmedic.network]
ignore_errors = True
[mypy-netmedic.gui]
ignore_errors = True
[mypy-netmedic.theme]
ignore_errors = True
[mypy-netmedic.ipc_framing]
ignore_errors = True
[mypy-netmedic.audit_log]
ignore_errors = True
[mypy-netmedic.probes]
ignore_errors = True
[mypy-netmedic.operators.vpn.angristan]
ignore_errors = True
[mypy-netmedic.operators.wifi]
ignore_errors = True
[mypy-netmedic.ipc_sync_client]
ignore_errors = True
[mypy-netmedic_ai.toolkit]
ignore_errors = True
[mypy-netmedic_ai.pilot]
ignore_errors = True
[mypy-netmedic_ai.param_validation]
ignore_errors = True
[mypy-netmedic_ai.guardrail]
ignore_errors = True
