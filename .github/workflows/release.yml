name: Release

on:
  push:
    tags:
      - "v*"

# M6: least privilege by default. The publish job alone gets
# contents:write, gated behind the `release` environment.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            policykit-1 gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11

      - name: Install Python packages
        # M6: pinned (were unpinned latest). Build venv consumes the
        # hash-pinned lock (cp312 scope matches setup-python 3.12).
        run: |
          python -m pip install --upgrade pip wheel setuptools "pytest==9.1.0" "pytest-cov==7.1.0" "hypothesis==6.168.1" "cyclonedx-bom==8.6.2"
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/
          # build_binary.sh requires ./venv (same split as CI build-smoke)
          python -m venv venv
          ./venv/bin/pip install --upgrade pip wheel setuptools
          ./venv/bin/pip install --require-hashes -r requirements.lock
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict

      - name: Test
        env:
          NETMEDIC_TEST_MODE: "1"
          NETMEDIC_SKIP_POLKIT: "1"
          NETMEDIC_USE_HELPER: "0"
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a python -m pytest tests/ -q

      - name: Build release assets
        run: |
          chmod +x scripts/prepare_release_assets.sh
          TAG="${GITHUB_REF_NAME#v}"
          ./scripts/prepare_release_assets.sh "$TAG"

      - name: Attest build provenance
        # M6: SLSA provenance for the shipped binary (does not replace the
        # GPG signature yet — removal of the long-lived key is a follow-up
        # once verifiers migrate; see SECURITY_ADVISORY notes).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/netmedic
            dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: |
            dist/netmedic
            dist/SHA256SUMS
            dist/sbom-python-*.txt
            dist/sbom-cyclonedx-*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # M6: write token exists ONLY here, behind the `release` environment.
    # The long-lived GPG key is also scoped to this gated job.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release-upload

      - name: Sign checksums (required on tags)
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
        run: |
          if [ -n "${RELEASE_GPG_PRIVATE_KEY:-}" ] && [ -n "${RELEASE_GPG_KEY_ID:-}" ]; then
            echo "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --armor --detach-sign \
              --local-user "$RELEASE_GPG_KEY_ID" \
              --output release-upload/SHA256SUMS.asc \
              release-upload/SHA256SUMS
          else
            echo "::error::GPG signing required for v* releases but secrets missing (RELEASE_GPG_PRIVATE_KEY/KEY_ID)."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: release-upload/*
