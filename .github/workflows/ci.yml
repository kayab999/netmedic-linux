name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            policykit-1

      - name: Runtime preflight
        run: |
          chmod +x scripts/check-deps.sh
          ./scripts/check-deps.sh

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools pytest ruff
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/

      - name: Lint
        run: ruff check netmedic/ netmedic_ai/ tools/ tests/

      - name: Test
        run: python -m pytest tests/ -q

  build-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config
          python -m pip install --upgrade pip wheel setuptools pyinstaller
          pip install -e netmedic/ --config-settings editable_mode=strict

      - name: Build standalone binary
        run: |
          chmod +x scripts/build_binary.sh
          ./scripts/build_binary.sh

      - name: Verify binary exists
        run: test -f dist/netmedic