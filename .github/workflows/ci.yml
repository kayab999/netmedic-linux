name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
      - name: pip-audit (supply chain)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc --local --skip-editable || echo "pip-audit found issues (see log)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        helper_mode: ["0", "1"]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      NETMEDIC_TEST_MODE: "1"
      NETMEDIC_SKIP_POLKIT: "1"
      NETMEDIC_USE_HELPER: ${{ matrix.helper_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            policykit-1 gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11

      - name: Runtime preflight
        run: |
          chmod +x scripts/check-deps.sh
          ./scripts/check-deps.sh

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools pytest pytest-cov ruff mypy pip-audit hypothesis
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/

      - name: Lint
        if: matrix.helper_mode == '0'
        run: ruff check netmedic/ netmedic_ai/ tools/ tests/

      - name: Typecheck (strict, 10 modules)
        if: matrix.helper_mode == '0' && matrix.python-version == '3.12'
        run: |
          mypy --config-file mypy.ini netmedic/netmedic/ipc_security.py netmedic/netmedic/helper_verbs.py netmedic/netmedic/action_catalog.py netmedic/netmedic/models.py netmedic/netmedic/ipc_bridge.py netmedic/netmedic/ipc_actions.py netmedic/netmedic/runtime.py netmedic/netmedic/lifecycle.py netmedic/netmedic/config.py netmedic/netmedic/polkit_auth.py

      - name: pip-audit
        if: matrix.helper_mode == '0' && matrix.python-version == '3.12'
        run: pip-audit --desc --local --skip-editable || echo "pip-audit findings (see log)"

      - name: Test (legacy elevation NETMEDIC_USE_HELPER=0)
        if: matrix.helper_mode == '0'
        env:
          NO_AT_BRIDGE: "1"
        # Sprint-1: total 85% (runtime 100%, ui 98%, ui_vpn 100%,
        # network 99%, angristan 98%). Gate 80 ratchets without tripping.
        run: xvfb-run -a python -m pytest tests/ -q --cov=netmedic --cov-report=term-missing --cov-fail-under=80

      - name: Test (helper-mode unit contracts NETMEDIC_USE_HELPER=1)
        if: matrix.helper_mode == '1'
        run: |
          # Full suite with helper forced on; fixtures still force 0 via autouse
          # unless tests opt in. Contract + helper verb tests are the focus.
          python -m pytest tests/test_helper_verbs.py tests/test_policy_and_catalog_contract.py -q

  netns-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install netns harness
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping curl libc-bin policykit-1
          python -m pip install --upgrade pip wheel setuptools pytest
          python -m venv venv
          # Goldens import NetworkMedic/probes only — skip PyGObject/cairo build.
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict --no-deps
          ./venv/bin/pip install pytest
      - name: pkexec env-scrub probe (C-8)
        # Empirical close of the adjudication's open question: what does the
        # root helper context actually receive from caller env? Runs with real
        # pkexec (root via sudo, no agent needed for `env`). Fails closed.
        run: |
          sudo MARKER_NETMEDIC_PROBE=expect-absent timeout 30 pkexec env > /tmp/pkexec-env.txt
          if grep -q MARKER_NETMEDIC_PROBE /tmp/pkexec-env.txt; then
            echo "::error::pkexec leaked caller marker env into root context"
            exit 1
          fi
          for v in LD_PRELOAD LD_LIBRARY_PATH PYTHONPATH PYTHONHOME NETMEDIC_HELPER_EXECUTE; do
            if sudo env "$v=probe" timeout 30 pkexec env 2>/dev/null | grep -q "^$v="; then
              echo "::error::pkexec leaked $v into root context"
              exit 1
            fi
          done
          echo "pkexec env scrub verified (marker + loader vars absent)"
      - name: Golden replay A+B (H1 TCP-only / incident)
        run: sudo ./scripts/netns-golden.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            policykit-1 gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11
          python -m pip install --upgrade pip wheel setuptools pytest hypothesis
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/
      - name: Release smoke
        env:
          NO_AT_BRIDGE: "1"
        run: |
          chmod +x scripts/smoke_release.sh
          xvfb-run -a ./scripts/smoke_release.sh

  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config
          python -m pip install --upgrade pip wheel setuptools pyinstaller
          python -m venv venv
          ./venv/bin/pip install --upgrade pip wheel setuptools pyinstaller pillow
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict

      - name: Build standalone binary
        run: |
          chmod +x scripts/build_binary.sh
          ./scripts/build_binary.sh

      - name: Verify binary exists
        run: test -f dist/netmedic

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible image (Dockerfile.build)
        run: docker build -f Dockerfile.build -t netmedic-build:ci .
      - name: Show artifact hash
        run: docker run --rm netmedic-build:ci