name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # F0: weekly supply-chain sweep so lockfile CVEs surface without a push.
    # Only `supply-chain-audit` runs on this trigger (the other jobs guard on
    # event_name); keep the cron odd-minute to avoid the top-of-hour rush.
    - cron: "17 6 * * 1"

# M6: least privilege by default; jobs that need more declare it.
permissions:
  contents: read

jobs:
  sast:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      # M6: actions pinned by SHA (comments record the moving tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Init CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - name: pip-audit (supply chain)
        # M6: blocking, against the lock — not the CI env. The old
        # `|| echo` swallowed findings and `--local` audited the runner.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc -r requirements.lock

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        helper_mode: ["0", "1"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      NETMEDIC_TEST_MODE: "1"
      NETMEDIC_SKIP_POLKIT: "1"
      NETMEDIC_USE_HELPER: ${{ matrix.helper_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            polkitd pkexec gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11

      - name: Runtime preflight
        run: |
          chmod +x scripts/check-deps.sh
          ./scripts/check-deps.sh

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools pytest pytest-cov ruff mypy pip-audit hypothesis
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/

      - name: Lint
        if: matrix.helper_mode == '0'
        run: ruff check netmedic/ netmedic_ai/ tools/ tests/

      - name: Generated policy in sync
        if: matrix.helper_mode == '0'
        # M8: policy XML is generated from action_catalog.ACTIONS.
        run: python scripts/generate_policy.py --check

      - name: Typecheck (strict, 13 modules)
        if: matrix.helper_mode == '0' && matrix.python-version == '3.12'
        run: |
          mypy --config-file mypy.ini netmedic/netmedic/ipc_security.py netmedic/netmedic/helper_verbs.py netmedic/netmedic/action_catalog.py netmedic/netmedic/models.py netmedic/netmedic/ipc_bridge.py netmedic/netmedic/ipc_actions.py netmedic/netmedic/runtime.py netmedic/netmedic/lifecycle.py netmedic/netmedic/config.py netmedic/netmedic/polkit_auth.py netmedic/netmedic/helper_main.py netmedic/netmedic/system.py netmedic/netmedic/validators.py

      - name: pip-audit
        if: matrix.helper_mode == '0' && matrix.python-version == '3.12'
        # M6: blocking, against the lock. Runs on 3.12 because the lock
        # hashes are scoped to the cp312 build target (see requirements.lock).
        run: pip-audit --desc -r requirements.lock

      - name: Test (legacy elevation NETMEDIC_USE_HELPER=0)
        if: matrix.helper_mode == '0'
        env:
          NO_AT_BRIDGE: "1"
        # Sprint-1: total 85% (runtime 100%, ui 98%, ui_vpn 100%,
        # network 99%, angristan 98%). Gate 80 ratchets without tripping.
        run: xvfb-run -a python -m pytest tests/ -q --cov=netmedic --cov-report=term-missing --cov-fail-under=80

      - name: Critical path coverage (per-file gates)
        if: matrix.helper_mode == '0'
        env:
          NO_AT_BRIDGE: "1"
        # M9: separate runs so ui.py at 98% cannot mask the root path.
        # Gates sit 1 point under measured values — ratchet upward, never down.
        run: |
          xvfb-run -a python -m pytest tests/ -q -p no:cacheprovider --cov=netmedic.helper_main --cov-report= --cov-fail-under=70
          xvfb-run -a python -m pytest tests/ -q -p no:cacheprovider --cov=netmedic.system --cov-report= --cov-fail-under=76
          xvfb-run -a python -m pytest tests/ -q -p no:cacheprovider --cov=netmedic.polkit_auth --cov-report= --cov-fail-under=82

      - name: Test (helper-mode unit contracts NETMEDIC_USE_HELPER=1)
        if: matrix.helper_mode == '1'
        run: |
          # Full suite with helper forced on; fixtures still force 0 via autouse
          # unless tests opt in. Contract + helper verb tests are the focus.
          python -m pytest tests/test_helper_verbs.py tests/test_policy_and_catalog_contract.py -q

  helper-install-integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install helper and polkit policy
        # H3: exercises the real installed wrapper and policy instead of the
        # in-repo dev marker. Interactive authorization and destructive verbs
        # remain VM checks (docs/VM_CHECKLIST.md).
        run: |
          sudo apt-get update
          sudo apt-get install -y polkitd pkexec
          chmod +x scripts/install-polkit-policy.sh
          ./scripts/install-polkit-policy.sh

      - name: Restart polkit and wait for action registration
        run: |
          sudo systemctl restart polkit || sudo service polkit restart
          for _ in $(seq 1 30); do
            if pkaction --action-id com.kayab.netmedic.flush-dns >/dev/null 2>&1; then
              echo "polkit registered com.kayab.netmedic.flush-dns"
              exit 0
            fi
            sleep 1
          done
          echo "::error::polkit did not register the NetMedic policy"
          pkaction 2>&1 | grep netmedic || true
          exit 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools pytest
          pip install -e netmedic/ --config-settings editable_mode=strict --no-deps

      - name: Installed helper contract
        env:
          NETMEDIC_INSTALLED_HELPER: "1"
        run: python -m pytest tests/test_installed_helper_contract.py -q

  netns-golden:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install netns harness
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping curl libc-bin polkitd pkexec
          python -m pip install --upgrade pip wheel setuptools pytest
          python -m venv venv
          # Goldens import NetworkMedic/probes only — skip PyGObject/cairo build.
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict --no-deps
          ./venv/bin/pip install pytest
      - name: pkexec env-scrub probe (C-8)
        # Empirical close of the adjudication's open question: what does the
        # root helper context actually receive from caller env? Runs with real
        # pkexec (root via sudo, no agent needed for `env`). Fails closed.
        run: |
          sudo MARKER_NETMEDIC_PROBE=expect-absent timeout 30 pkexec env > /tmp/pkexec-env.txt
          if grep -q MARKER_NETMEDIC_PROBE /tmp/pkexec-env.txt; then
            echo "::error::pkexec leaked caller marker env into root context"
            exit 1
          fi
          for v in LD_PRELOAD LD_LIBRARY_PATH PYTHONPATH PYTHONHOME NETMEDIC_HELPER_EXECUTE; do
            if sudo env "$v=probe" timeout 30 pkexec env 2>/dev/null | grep -q "^$v="; then
              echo "::error::pkexec leaked $v into root context"
              exit 1
            fi
          done
          echo "pkexec env scrub verified (marker + loader vars absent)"
      - name: Golden replay A+B (H1 TCP-only / incident)
        run: sudo ./scripts/netns-golden.sh

  smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            polkitd pkexec gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11
          python -m pip install --upgrade pip wheel setuptools pytest hypothesis
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/
      - name: Release smoke
        env:
          NO_AT_BRIDGE: "1"
        run: |
          chmod +x scripts/smoke_release.sh
          xvfb-run -a ./scripts/smoke_release.sh

  build-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config
          python -m pip install --upgrade pip wheel setuptools pyinstaller
          python -m venv venv
          ./venv/bin/pip install --upgrade pip wheel setuptools pyinstaller pillow
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict

      - name: Build standalone binary
        run: |
          chmod +x scripts/build_binary.sh
          ./scripts/build_binary.sh

      - name: Verify binary exists
        run: test -f dist/netmedic

  container-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build reproducible image (Dockerfile.build)
        run: docker build -f Dockerfile.build -t netmedic-build:ci .
      - name: Show artifact hash
        run: docker run --rm netmedic-build:ci

  supply-chain-audit:
    # F0: scheduled-only weekly audit. It never runs on push/PR (the blocking
    # pip-audit lives in `sast`), and it audits the pinned lock, not the
    # runner environment.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: pip-audit (locks)
        # F7 appends requirements-ai.lock here once the AI wheel is pinned.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc -r requirements.lock
