name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
      - name: pip-audit (supply chain)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc --local --skip-editable || echo "pip-audit found issues (see log)"

  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        helper_mode: ["0", "1"]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      NETMEDIC_TEST_MODE: "1"
      NETMEDIC_SKIP_POLKIT: "1"
      NETMEDIC_USE_HELPER: ${{ matrix.helper_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            policykit-1 gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11

      - name: Runtime preflight
        run: |
          chmod +x scripts/check-deps.sh
          ./scripts/check-deps.sh

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools pytest pytest-cov ruff mypy pip-audit
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/

      - name: Lint
        if: matrix.helper_mode == '0'
        run: ruff check netmedic/ netmedic_ai/ tools/ tests/

      - name: Typecheck (strict, security paths)
        if: matrix.helper_mode == '0' && matrix.python-version == '3.12'
        run: |
          mypy --config-file mypy.ini netmedic/netmedic/ipc_security.py netmedic/netmedic/helper_verbs.py netmedic/netmedic/action_catalog.py netmedic/netmedic/models.py || echo "mypy strict warnings (see log)"

      - name: pip-audit
        if: matrix.helper_mode == '0' && matrix.python-version == '3.12'
        run: pip-audit --desc --local --skip-editable || echo "pip-audit findings (see log)"

      - name: Test (legacy elevation NETMEDIC_USE_HELPER=0)
        if: matrix.helper_mode == '0'
        env:
          NO_AT_BRIDGE: "1"
        # Measured 65% (2026-09-24): network/angristan/ui_vpn mocked-thin. Floor 60, raise to 70/85 in P1 with Hypothesis + operator tests.
        run: xvfb-run -a python -m pytest tests/ -q --cov=netmedic --cov-report=term-missing --cov-fail-under=60

      - name: Test (helper-mode unit contracts NETMEDIC_USE_HELPER=1)
        if: matrix.helper_mode == '1'
        run: |
          # Full suite with helper forced on; fixtures still force 0 via autouse
          # unless tests opt in. Contract + helper verb tests are the focus.
          python -m pytest tests/test_helper_verbs.py tests/test_policy_and_catalog_contract.py -q

  netns-golden:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install netns harness
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping curl libc-bin
          python -m pip install --upgrade pip wheel setuptools pytest
          python -m venv venv
          # Goldens import NetworkMedic/probes only — skip PyGObject/cairo build.
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict --no-deps
          ./venv/bin/pip install pytest
      - name: Golden replay A+B (H1 TCP-only / incident)
        run: sudo ./scripts/netns-golden.sh

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config \
            policykit-1 gir1.2-polkit-1.0 network-manager iproute2 \
            iputils-ping curl xvfb dbus-x11
          python -m pip install --upgrade pip wheel setuptools pytest
          pip install -e netmedic/ --config-settings editable_mode=strict
          pip install -e netmedic_ai/
      - name: Release smoke
        env:
          NO_AT_BRIDGE: "1"
        run: |
          chmod +x scripts/smoke_release.sh
          xvfb-run -a ./scripts/smoke_release.sh

  build-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config
          python -m pip install --upgrade pip wheel setuptools pyinstaller
          python -m venv venv
          ./venv/bin/pip install --upgrade pip wheel setuptools pyinstaller pillow
          ./venv/bin/pip install -e netmedic/ --config-settings editable_mode=strict

      - name: Build standalone binary
        run: |
          chmod +x scripts/build_binary.sh
          ./scripts/build_binary.sh

      - name: Verify binary exists
        run: test -f dist/netmedic