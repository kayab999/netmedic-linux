# mutmut 3.x — mutation testing for security-critical modules (P1.4).
#
# Scoped runs (full-repo mutation is too slow for CI):
#   venv/bin/mutmut run --do-not-mutate 'netmedic/netmedic/*' \
#     --only-mutate 'netmedic/netmedic/ipc_security.py'   # or helper_verbs.py
# Target: >80% kill rate on ipc_security.py + helper_verbs.py.
[mutmut]
source_paths = netmedic
# also_copy: the mutants/ sandbox only gets source+tests by default;
# policy-XML contract tests read assets/ via relative path.
also_copy =
    assets
    VERBS.md
# setup.cfg for the full P1.4 scope (both files). Narrow temporarily per run:
#   only_mutate = */ipc_security.py   then   only_mutate = */helper_verbs.py
# (fnmatch requires full-path match, hence the */ prefix.)
only_mutate =
    */ipc_security.py
mutate_only_covered_lines = true
pytest_add_cli_args =
    -q
    -p
    no:cacheprovider
pytest_add_cli_args_test_selection =
    tests/test_ipc.py
    tests/test_ipc_actions.py
    tests/test_ipc_peer.py
    tests/test_polkit_auth.py
    tests/test_polkit_subject.py
    tests/test_audit_log.py
    tests/test_helper_verbs.py
    tests/test_command_runner_allowlist.py
    tests/test_policy_and_catalog_contract.py
    tests/test_properties.py
    tests/test_security.py
    tests/test_medic_iface_allowlist.py
    tests/test_verbs_doc.py
    tests/test_action_catalog.py
