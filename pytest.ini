[pytest]
testpaths = tests
# F0: the repo root holds a `netmedic/` directory that is not the package.
# Without this, `python -m pytest tests/` from the root imports that directory
# as a namespace package and shadows the installed one (ImportError on
# `netmedic.__version__`). Must work with normal and strict editable installs.
pythonpath = netmedic
# Dump all thread stacks if a test stalls: the next hang names its culprit
# in the log instead of burning runner minutes silently.
faulthandler_timeout = 120
markers =
    ai: tests that require the optional netmedic_ai package
    netns: requires netns harness (root)
filterwarnings =
    always::DeprecationWarning
    always::UserWarning
    error:NetResult\.success is deprecated.*:UserWarning