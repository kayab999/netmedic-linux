[pytest]
testpaths = tests
# Dump all thread stacks if a test stalls: the next hang names its culprit
# in the log instead of burning runner minutes silently.
faulthandler_timeout = 120
markers =
    ai: tests that require the optional netmedic_ai package
    netns: requires netns harness (root)
filterwarnings =
    always::DeprecationWarning
    always::UserWarning
    error:NetResult\.success is deprecated.*:UserWarning