[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmedic"
version = "1.9.0"
authors = [
    { name = "Kayab Software", email = "support@kayabsoftware.com" },
]
description = "Professional network diagnostics, repair, and infrastructure management for Linux."
# Floor 3.10 — 3.8 EOL, PyGObject>=3.42, X|Y typing, CI 3.10-3.13 on Ubuntu 22.04/24.04.
# M7: ceiling <3.14; 3.13 is covered by the CI matrix (PyGObject builds from
# source there). Pillow is not a runtime dependency (only scripts/generate_icon.py
# uses it; the build image pins its own).
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyGObject>=3.42",
]

[project.scripts]
netmedic = "netmedic.app:main"
netmedic-helper = "netmedic.helper_main:main"

[project.optional-dependencies]
ai = [
    "llama-cpp-python>=0.2.57"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netmedic*"]

[tool.setuptools.package-data]
# F2: vendored VPN installer + provenance/license ship with the package.
netmedic = ["data/vpn/*"]
