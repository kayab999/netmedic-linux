[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmedic"
version = "1.6.0"
authors = [
    { name = "Kayab Software", email = "support@kayabsoftware.com" },
]
description = "Professional network diagnostics, repair, and infrastructure management for Linux."
# Breaking (1.6.0): floor 3.10 — 3.8 EOL, Pillow>=10/PyGObject>=3.42, X|Y typing, CI 3.10-3.12 on Ubuntu 22.04/24.04
requires-python = ">=3.10,<3.13"
dependencies = [
    "PyGObject>=3.42",
    "pillow>=10.0",
]

[project.scripts]
netmedic = "netmedic.app:main"
netmedic-helper = "netmedic.helper_main:main"

[project.optional-dependencies]
ai = [
    "llama-cpp-python>=0.2.57"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netmedic*"]
